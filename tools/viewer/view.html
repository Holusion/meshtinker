<!DOCTYPE html>
<!--
  A model rendered with three.js as eCorpus's viewer (Voyager) loads it: GLTFLoader with Draco, meshopt and KTX2
  (Basis transcoder), AVIF and WebP through the browser, and normals computed where a primitive has none
  (Voyager's computeVertexNormals). Served by tools/viewer/voyager.py, screenshotted by tools/viewer/screenshot.mjs:
    view.html?model=/NAME/model.glb[&az=30&el=20&zoom=1&target=x,y,z][&eye=x,y,z][&fov=35]
  az and el are the camera's azimuth and elevation in degrees around the scene's bounds, zoom > 1 moves closer;
  target (a fraction of the bounds, 0.5,0.5,0.5 at the center) is the point looked at. eye, in the same fractions,
  places the camera there instead, for views from inside a model (a cave, a room): az, el and zoom are then unused.
  fov is the vertical field of view in degrees; info=0 hides the label. Once drawn, window.view('az=..&el=..') draws another view of the
  same model, with the same parameters, for screenshot.mjs's --view.
  Voyager's own page can't render headless (no camera is ever set up there), hence this page.
-->
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; background: #3a3a3a; overflow: hidden; } canvas { display: block; }
#info { position: absolute; left: 8px; bottom: 6px; color: #ddd; font: 13px sans-serif; }</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const number = (name, fallback) => Number(params.get(name) ?? fallback);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3a3a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const light = new THREE.DirectionalLight(0xffffff, 1.5);
scene.add(light);

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('/three/examples/jsm/libs/draco/gltf/');
loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);
const ktx2 = new KTX2Loader();
ktx2.setTranscoderPath('/three/examples/jsm/libs/basis/');
ktx2.detectSupport(renderer);
loader.setKTX2Loader(ktx2);

const started = performance.now();
loader.load(params.get('model'), (gltf) => {
  const root = gltf.scene;
  let triangles = 0;
  root.traverse((object) => {
    if (!object.isMesh) return;
    if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
    const index = object.geometry.index;
    triangles += (index ? index.count : object.geometry.attributes.position.count) / 3;
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const radius = size.length() / 2;
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, radius / 1000, radius * 100);
  scene.add(light.target);
  // Places the camera and the light for a view's parameters.
  const place = (view) => {
    const value = (name, fallback) => Number(view.get(name) ?? fallback);
    const [tx, ty, tz] = (view.get('target') ?? '0.5,0.5,0.5').split(',').map(Number);
    const target = new THREE.Vector3(box.min.x + tx * size.x, box.min.y + ty * size.y, box.min.z + tz * size.z);
    const fov = value('fov', 35);
    camera.fov = fov;
    camera.updateProjectionMatrix();
    if (view.has('eye')) {
      const [ex, ey, ez] = view.get('eye').split(',').map(Number);
      camera.position.set(box.min.x + ex * size.x, box.min.y + ey * size.y, box.min.z + ez * size.z);
      camera.lookAt(target);
      // From inside, a light far outside the bounds is behind the walls: it sits at the eye, as a visitor's lamp.
      light.position.copy(camera.position);
      light.target.position.copy(target);
    } else {
      const az = THREE.MathUtils.degToRad(value('az', 30)), el = THREE.MathUtils.degToRad(value('el', 15));
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)) / value('zoom', 1);
      camera.position.set(target.x + distance * Math.cos(el) * Math.sin(az), target.y + distance * Math.sin(el),
        target.z + distance * Math.cos(el) * Math.cos(az));
      camera.lookAt(target);
      light.position.copy(camera.position).add(new THREE.Vector3(radius, radius * 2, 0));
      light.target.position.set(0, 0, 0);
    }
  };
  place(params);
  window.view = (query) => {
    window.renderDone = undefined;
    place(new URLSearchParams(query));
    renderer.render(scene, camera);
    requestAnimationFrame(() => { renderer.render(scene, camera); window.renderDone = 0; });
    return true;
  };
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  // info=0 leaves the label out, so that renders of two files compare on the model alone.
  if (params.get('info') !== '0') document.getElementById('info').textContent =
    `${params.get('model').split('/').slice(-2).join('/')}  ${Math.round(triangles).toLocaleString('en')} triangles`;
  requestAnimationFrame(() => { renderer.render(scene, camera); window.renderDone = (performance.now() - started) / 1000; });
}, undefined, (error) => { console.error('load failed', error?.message ?? error); window.renderDone = -1; });
</script>
</body>
</html>
